version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandate_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=${APP_ENV:-demo}
      - DATABASE_URL=sqlite:///./mandate.db
      - MANDATE_SIGNING_KEY=${MANDATE_SIGNING_KEY}
      - PAYPAL_SIMULATION_MODE=true
      - LLM_PROVIDER=mock
      - DEMO_REPLAY_MODE=false
      - FRONTEND_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandate_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
