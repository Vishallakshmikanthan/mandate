version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mandate_postgres
    environment:
      - POSTGRES_USER=mandate
      - POSTGRES_PASSWORD=mandate
      - POSTGRES_DB=mandate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mandate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandate_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=postgresql://mandate:mandate@postgres:5432/mandate
      - REDIS_URL=redis://redis:6379/0
      - MANDATE_SIGNING_KEY=${MANDATE_SIGNING_KEY:-mandate_super_secure_secret_signing_key_32_bytes_min!}
      - PAYPAL_SIMULATION_MODE=${PAYPAL_SIMULATION_MODE:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - DEMO_REPLAY_MODE=${DEMO_REPLAY_MODE:-false}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandate_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
  redis_data:
